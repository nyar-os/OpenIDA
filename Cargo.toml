[workspace]
resolver = "2"
members = ["projects/crates/*"]
default-members = ["projects/crates/ida-core", "projects/crates/ida-napi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenIDA Authors"]
repository = "https://github.com/nyar-os/OpenIDA"

[workspace.dependencies]
# Shared host facade for the Node-API and WebView surfaces. Cross-repo git
# dependencies pin the full 40-character revision so local builds and CI resolve
# the same commit.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false, features = ["webview"] }
# Shared binary framework. Keep the same `boost.rs` revision as the rest of the
# OpenX applications so parsing and target models do not drift.
data-binary-inspect = { git = "https://github.com/oovm/boost.rs", rev = "9785e3c2cd753e16bc4cc8952ce5d973af0c3b69" }
data-binary-pe = { git = "https://github.com/oovm/boost.rs", rev = "9785e3c2cd753e16bc4cc8952ce5d973af0c3b69" }
data-binary-mach-o = { git = "https://github.com/oovm/boost.rs", rev = "9785e3c2cd753e16bc4cc8952ce5d973af0c3b69" }
data-binary-sevenz = { git = "https://github.com/oovm/boost.rs", rev = "9785e3c2cd753e16bc4cc8952ce5d973af0c3b69" }
data-compression = { git = "https://github.com/oovm/boost.rs", rev = "9785e3c2cd753e16bc4cc8952ce5d973af0c3b69", features = ["lzma"] }
boost-source = { git = "https://github.com/oovm/boost.rs", rev = "9785e3c2cd753e16bc4cc8952ce5d973af0c3b69" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ida-inflate = { path = "projects/crates/ida-inflate" }
ida-brotli = { path = "projects/crates/ida-brotli" }
ida-x86 = { path = "projects/crates/ida-x86" }
open-ida-core = { path = "projects/crates/ida-core" }

[workspace.lints.rust]
missing_docs = "deny"

[profile.release]
lto = true
panic = "abort"
